<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Haskins House Records — Substance Grid</title>
  <link rel="stylesheet" href="../styles/warhol.css" />
  <style>
    body.hhr-warhol {
      background: #111;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .grid-wrap {
      max-width: 960px;
      margin: 1.25rem auto 2rem;
      padding: 0 1rem;
      flex: 1;
      width: 100%;
    }
    .intro {
      text-align: center;
      margin-bottom: 1rem;
      font-family: var(--font-display);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .intro h1 {
      margin: 0;
      font-size: clamp(1.1rem, 3vw, 1.6rem);
      color: var(--yellow);
    }
    .intro p {
      margin: 0.4rem 0 0;
      color: var(--mint);
      font-size: 0.75rem;
      letter-spacing: 0.18em;
    }

    .warhol-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      aspect-ratio: 1 / 1;
    }
    @media (max-width: 640px) {
      .warhol-grid { gap: 6px; }
    }

    .cell {
      position: relative;
      border: 4px solid #000;
      cursor: pointer;
      overflow: hidden;
      outline: none;
      isolation: isolate;
      transition: transform 0.15s ease, box-shadow 0.15s ease, z-index 0s;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.85);
    }
    .cell:hover, .cell:focus-visible {
      transform: scale(1.03) rotate(-0.4deg);
      z-index: 2;
      box-shadow: 7px 7px 0 var(--hot-pink);
    }
    .cell .art {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .cell img.logo {
      width: 88%;
      height: 88%;
      object-fit: contain;
      filter: contrast(1.15) saturate(1.2);
    }
    .cell .label-chip {
      position: absolute;
      left: 6px;
      bottom: 6px;
      background: #000;
      color: #fff;
      font-family: var(--font-display);
      font-size: clamp(0.45rem, 1.4vw, 0.65rem);
      letter-spacing: 0.06em;
      padding: 0.2rem 0.4rem;
      border: 2px solid #fff;
      text-transform: uppercase;
      z-index: 2;
    }
    /* Misregister offset layer */
    .cell .mis {
      position: absolute;
      inset: 0;
      pointer-events: none;
      mix-blend-mode: multiply;
      opacity: 0.18;
      transform: translate(3px, -2px);
      background: inherit;
    }

    /* --- Cell colorways & CSS illustrations --- */
    .cell-cassette { background: #000; }
    .cell-toad { background: #e10600; }
    .cell-vinyl { background: var(--hot-pink); }
    .cell-jacket { background: #c41e3a; }
    .cell-cassette-alt { background: #000; }
    .cell-store { background: #1e4dff; }
    .cell-bst { background: var(--yellow); }
    .cell-toad-alt { background: #000; }
    .cell-rack { background: #1a9b8e; }

    /* Vinyl sleeve CSS art */
    .vinyl-art {
      width: 72%;
      height: 72%;
      background: var(--cyan);
      border: 4px solid #000;
      position: relative;
      box-shadow: -8px 6px 0 #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .vinyl-art .disc {
      position: absolute;
      right: -18%;
      width: 55%;
      height: 70%;
      border-radius: 50%;
      background: radial-gradient(circle at center, #222 12%, #111 13%, #333 14%, #0a0a0a 50%);
      border: 3px solid #000;
    }
    .vinyl-art .house {
      width: 42%;
      height: 42%;
      border: 3px solid #000;
      background: transparent;
      clip-path: polygon(50% 0%, 100% 28%, 100% 100%, 0 100%, 0 28%);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      font-family: var(--font-display);
      font-size: clamp(0.7rem, 2.5vw, 1.4rem);
      color: #000;
      padding-bottom: 8%;
      z-index: 1;
    }

    /* Leather jacket CSS */
    .jacket-art {
      width: 55%;
      height: 70%;
      position: relative;
    }
    .jacket-art .body {
      width: 100%;
      height: 100%;
      background: #111;
      border: 3px solid #000;
      border-radius: 8% 8% 12% 12%;
      box-shadow: inset 0 0 0 3px #333, 4px 4px 0 #000;
      position: relative;
    }
    .jacket-art .lapel-l,
    .jacket-art .lapel-r {
      position: absolute;
      top: 8%;
      width: 28%;
      height: 42%;
      background: #1a1a1a;
      border: 2px solid #444;
    }
    .jacket-art .lapel-l { left: 8%; transform: skewX(8deg); }
    .jacket-art .lapel-r { right: 8%; transform: skewX(-8deg); }
    .jacket-art .zip {
      position: absolute;
      left: 50%;
      top: 15%;
      bottom: 12%;
      width: 3px;
      background: #888;
      transform: translateX(-50%);
    }
    .jacket-text {
      position: absolute;
      right: 4%;
      top: 50%;
      transform: translateY(-50%) rotate(90deg);
      transform-origin: center;
      font-family: var(--font-display);
      font-size: clamp(0.4rem, 1.5vw, 0.7rem);
      color: #fff;
      letter-spacing: 0.08em;
      white-space: nowrap;
      text-shadow: 2px 2px 0 #000;
    }

    /* Storefront CSS */
    .store-art {
      width: 70%;
      height: 78%;
      position: relative;
    }
    .store-art .building {
      width: 100%;
      height: 100%;
      background: var(--yellow);
      border: 4px solid #000;
      position: relative;
      box-shadow: 5px 5px 0 #000;
    }
    .store-art .awning {
      position: absolute;
      top: 28%;
      left: -4%;
      right: -4%;
      height: 12%;
      background: repeating-linear-gradient(90deg, #e10600 0 12%, #fff 12% 24%);
      border: 3px solid #000;
      z-index: 2;
    }
    .store-art .window {
      position: absolute;
      bottom: 10%;
      left: 12%;
      right: 12%;
      height: 32%;
      background: #87ceeb;
      border: 3px solid #000;
    }
    .store-art .door {
      position: absolute;
      bottom: 10%;
      left: 38%;
      width: 24%;
      height: 32%;
      background: #5c3317;
      border: 3px solid #000;
      z-index: 1;
    }
    .store-art .sign {
      position: absolute;
      top: 6%;
      left: 0;
      right: 0;
      text-align: center;
      font-family: var(--font-display);
      font-size: clamp(0.35rem, 1.2vw, 0.55rem);
      color: #1e4dff;
      letter-spacing: 0.04em;
      line-height: 1.15;
    }

    /* BUY SELL TRADE stamp */
    .bst-art {
      width: 82%;
      height: 55%;
      background: var(--yellow);
      border: 4px solid #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 5px 5px 0 var(--hot-pink);
      text-align: center;
      padding: 0.5rem;
    }
    .bst-art .big {
      font-family: var(--font-display);
      color: var(--hot-pink);
      font-size: clamp(0.7rem, 2.8vw, 1.35rem);
      line-height: 1.05;
      letter-spacing: 0.02em;
    }
    .bst-art .small {
      margin-top: 0.35rem;
      font-family: var(--font-display);
      color: var(--hot-pink);
      font-size: clamp(0.35rem, 1.1vw, 0.55rem);
      letter-spacing: 0.08em;
    }

    /* Clothes rack CSS */
    .rack-art {
      width: 85%;
      height: 70%;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 4%;
    }
    .rack-art .pole {
      position: absolute;
      top: 8%;
      left: 5%;
      right: 5%;
      height: 6px;
      background: #ccc;
      border: 2px solid #000;
      border-radius: 3px;
      z-index: 2;
    }
    .rack-art .leg-l, .rack-art .leg-r {
      position: absolute;
      top: 8%;
      width: 5px;
      bottom: 0;
      background: #bbb;
      border: 2px solid #000;
    }
    .rack-art .leg-l { left: 8%; }
    .rack-art .leg-r { right: 8%; }
    .hanger {
      width: 18%;
      height: 72%;
      background: var(--hot-pink);
      border: 3px solid #000;
      border-radius: 10% 10% 4% 4%;
      position: relative;
      z-index: 1;
      box-shadow: 3px 3px 0 #000;
    }
    .hanger:nth-child(4) { background: var(--red); height: 68%; }
    .hanger:nth-child(5) { background: #222; height: 75%; }
    .hanger:nth-child(6) { background: var(--butterscotch); height: 65%; }
    .hanger::before {
      content: "";
      position: absolute;
      top: -10%;
      left: 50%;
      width: 10px;
      height: 14%;
      border: 2px solid #000;
      border-bottom: none;
      border-radius: 50% 50% 0 0;
      transform: translateX(-50%);
      background: transparent;
    }

    /* Overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.78);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }
    .overlay.open { display: flex; }
    .overlay-panel {
      background: var(--white);
      color: #000;
      border: 5px solid #000;
      box-shadow: 10px 10px 0 var(--hot-pink), -4px -4px 0 var(--cyan);
      max-width: 480px;
      width: 100%;
      padding: 1.25rem;
      position: relative;
      animation: popIn 0.18s ease;
    }
    @keyframes popIn {
      from { transform: scale(0.92) rotate(-1deg); opacity: 0; }
      to { transform: scale(1) rotate(0); opacity: 1; }
    }
    .overlay-panel .close {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      width: 2.2rem;
      height: 2.2rem;
      border: 3px solid #000;
      background: var(--yellow);
      font-family: var(--font-display);
      font-size: 1.1rem;
      cursor: pointer;
      line-height: 1;
    }
    .overlay-panel .preview {
      aspect-ratio: 1;
      border: 4px solid #000;
      margin-bottom: 1rem;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .overlay-panel .preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .overlay-panel h2 {
      margin: 0 0 0.35rem;
      font-family: var(--font-display);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 1.25rem;
    }
    .overlay-panel p {
      margin: 0 0 1rem;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .overlay-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .nav-links {
      text-align: center;
      margin: 0.5rem 0 1rem;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .nav-links a {
      color: var(--cyan);
      margin: 0 0.5rem;
      text-decoration: none;
      border-bottom: 2px solid var(--hot-pink);
    }
  </style>
</head>
<body class="hhr-warhol">
  <header class="site-header">
    <a href="../02-shop/index.html">Haskins House Records</a>
    <span class="tag">Vinyl &amp; Vintage Clothes Mix · Buy Sell Trade</span>
  </header>

  <div class="grid-wrap">
    <div class="intro">
      <h1>Substance Grid</h1>
      <p>Click a cell · Esc to close</p>
    </div>
    <nav class="nav-links" aria-label="Pages">
      <a href="./index.html">Grid</a>
      <a href="../02-shop/index.html">Shop</a>
      <a href="../03-pdp/index.html">PDP</a>
    </nav>

    <div class="warhol-grid" id="grid" role="list">
      <!-- 1 Cassette -->
      <button type="button" class="cell cell-cassette" role="listitem" data-id="cassette"
        data-label="Cassette Logo" data-desc="Mint silk-screen cassette — Vinyl &amp; Vintage Clothes Mix. Call or text 740-771-0017."
        data-img="../assets/cassette-mint.jpeg" aria-label="Cassette logo cell">
        <div class="art"><img class="logo" src="../assets/cassette-mint.jpeg" alt="Haskins House Records cassette" /></div>
        <span class="label-chip">Cassette</span>
      </button>

      <!-- 2 Toad -->
      <button type="button" class="cell cell-toad" role="listitem" data-id="toad"
        data-label="Toad Logo" data-desc="Lime toad on hot red — house H mark on the sweater. Haskins House Records."
        data-img="../assets/toad-red-lime.jpeg" aria-label="Toad logo cell">
        <div class="art"><img class="logo" src="../assets/toad-red-lime.jpeg" alt="Haskins House Records toad" /></div>
        <span class="label-chip">Toad</span>
      </button>

      <!-- 3 Vinyl sleeve -->
      <button type="button" class="cell cell-vinyl" role="listitem" data-id="vinyl"
        data-label="Vinyl Sleeve" data-desc="Cyan sleeve on hot pink — house H records mark peeking disc."
        data-bg="var(--hot-pink)" aria-label="Vinyl sleeve cell">
        <div class="art">
          <div class="vinyl-art"><div class="disc"></div><div class="house">H</div></div>
        </div>
        <span class="label-chip">Vinyl</span>
      </button>

      <!-- 4 Leather jacket -->
      <button type="button" class="cell cell-jacket" role="listitem" data-id="jacket"
        data-label="Leather Jacket" data-desc="Vintage leather — Buy Sell Trade the real thing at 534 2nd Street."
        data-bg="#c41e3a" aria-label="Leather jacket cell">
        <div class="art">
          <div class="jacket-art">
            <div class="body">
              <div class="lapel-l"></div>
              <div class="lapel-r"></div>
              <div class="zip"></div>
            </div>
          </div>
          <span class="jacket-text">HASKINS HOUSE RECORDS</span>
        </div>
        <span class="label-chip">Jacket</span>
      </button>

      <!-- 5 Cassette alt -->
      <button type="button" class="cell cell-cassette-alt" role="listitem" data-id="cassette-alt"
        data-label="Cassette (Lime)" data-desc="Lime colorway cassette — 534 2nd Street, Portsmouth, OH 45662."
        data-img="../assets/cassette-lime.jpeg" aria-label="Lime cassette cell">
        <div class="art"><img class="logo" src="../assets/cassette-lime.jpeg" alt="Lime cassette logo" /></div>
        <span class="label-chip">Cassette Alt</span>
      </button>

      <!-- 6 Storefront -->
      <button type="button" class="cell cell-store" role="listitem" data-id="store"
        data-label="Storefront" data-desc="534 2nd Street, Portsmouth, OH 45662 — Vinyl &amp; Vintage Clothes Mix."
        data-img="../assets/storefront.jpeg" data-bg="#1e4dff" aria-label="Storefront cell">
        <div class="art">
          <img class="logo" src="../assets/storefront.jpeg" alt="Haskins House storefront" style="filter: contrast(1.3) saturate(1.4) brightness(1.05);" />
        </div>
        <span class="label-chip">Store</span>
      </button>

      <!-- 7 BUY SELL TRADE -->
      <button type="button" class="cell cell-bst" role="listitem" data-id="bst"
        data-label="Buy Sell Trade" data-desc="Bring your vinyl &amp; vintage. Call or text 740-771-0017."
        data-bg="var(--yellow)" aria-label="Buy Sell Trade stamp cell">
        <div class="art">
          <div class="bst-art">
            <div class="big">BUY<br>SELL<br>TRADE</div>
            <div class="small">HASKINS HOUSE RECORDS</div>
          </div>
        </div>
        <span class="label-chip">BST</span>
      </button>

      <!-- 8 Toad alt B&W -->
      <button type="button" class="cell cell-toad-alt" role="listitem" data-id="toad-alt"
        data-label="Toad (B&amp;W Stamp)" data-desc="High-contrast toad stamp — silk-screen alternate."
        data-img="../assets/toad-bw.jpeg" aria-label="Toad black and white cell">
        <div class="art"><img class="logo" src="../assets/toad-bw.jpeg" alt="Toad B&amp;W stamp" style="filter: contrast(1.25);" /></div>
        <span class="label-chip">Toad Alt</span>
      </button>

      <!-- 9 Clothes rack -->
      <button type="button" class="cell cell-rack" role="listitem" data-id="rack"
        data-label="Clothes Rack" data-desc="Vintage clothes mix on the rack — denim, leather, band tees."
        data-bg="#1a9b8e" aria-label="Clothes rack cell">
        <div class="art">
          <div class="rack-art">
            <div class="pole"></div>
            <div class="leg-l"></div>
            <div class="leg-r"></div>
            <div class="hanger"></div>
            <div class="hanger"></div>
            <div class="hanger"></div>
            <div class="hanger"></div>
          </div>
        </div>
        <span class="label-chip">Rack</span>
      </button>
    </div>
  </div>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title" hidden>
    <div class="overlay-panel">
      <button type="button" class="close" id="ov-close" aria-label="Close">×</button>
      <div class="preview" id="ov-preview"></div>
      <h2 id="ov-title"></h2>
      <p id="ov-desc"></p>
      <div class="overlay-actions">
        <button type="button" class="btn-warhol btn-pink" id="ov-interest">Add interest</button>
        <a class="btn-warhol btn-cyan" href="tel:7407710017">Call 740-771-0017</a>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    534 2nd Street, Portsmouth, OH 45662 · <a href="tel:7407710017">740-771-0017</a>
  </footer>

  <script>
    (function () {
      const overlay = document.getElementById("overlay");
      const preview = document.getElementById("ov-preview");
      const title = document.getElementById("ov-title");
      const desc = document.getElementById("ov-desc");
      const closeBtn = document.getElementById("ov-close");
      const interestBtn = document.getElementById("ov-interest");
      let lastFocus = null;

      function openCell(btn) {
        lastFocus = btn;
        title.textContent = btn.dataset.label || "";
        desc.textContent = btn.dataset.desc || "";
        preview.innerHTML = "";
        preview.style.background = btn.dataset.bg || "#111";

        if (btn.dataset.img) {
          const img = document.createElement("img");
          img.src = btn.dataset.img;
          img.alt = btn.dataset.label || "";
          preview.appendChild(img);
        } else {
          const clone = btn.querySelector(".art").cloneNode(true);
          clone.style.width = "100%";
          clone.style.height = "100%";
          preview.appendChild(clone);
        }

        interestBtn.textContent = "Add interest";
        interestBtn.disabled = false;
        overlay.hidden = false;
        overlay.classList.add("open");
        closeBtn.focus();
      }

      function closeOverlay() {
        overlay.classList.remove("open");
        overlay.hidden = true;
        preview.innerHTML = "";
        if (lastFocus) lastFocus.focus();
      }

      document.querySelectorAll(".cell").forEach(function (btn) {
        btn.addEventListener("click", function () { openCell(btn); });
        btn.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openCell(btn);
          }
        });
      });

      closeBtn.addEventListener("click", closeOverlay);
      overlay.addEventListener("click", function (e) {
        if (e.target === overlay) closeOverlay();
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && overlay.classList.contains("open")) closeOverlay();
      });
      interestBtn.addEventListener("click", function () {
        interestBtn.textContent = "Interested ✓";
        interestBtn.disabled = true;
      });
    })();
  </script>
  <script src="../assets/hydrate-jpeg.js"></script>
</body>
</html>
